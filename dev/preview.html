<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ST Cache Counter 测试预览</title><link rel="stylesheet" href="/style.css"><style>body{font:16px system-ui;background:#20242d;color:#e3e8f2;max-width:960px;margin:40px auto;padding:20px}button{padding:10px;margin:8px;background:#d4defc;border:0;border-radius:6px;cursor:pointer}.mes{border:1px solid #626b7d;border-radius:8px;padding:18px;margin:18px 0}.stcc-badge{font-size:14px}.inline-drawer-header{margin-top:30px}code{color:#b5c6fc}</style><h1>楼层 Token / 缓存统计</h1><p>模拟 SillyTavern 1.19.0 事件与 API usage，无付费请求。</p><button id="generate">模拟 OpenAI 流式回复</button><button id="continue">模拟续写</button><button id="swipe">切换旧候选</button><div id="chat"><div class="mes" mesid="0"><div class="mes_block">用户：你好</div></div><div class="mes" mesid="1"><div class="mes_block">AI：等待模拟生成</div></div></div><div id="extensions_settings2"></div><script type="module">
const handlers = new Map();
const chat = [{is_user:true,mes:'你好'},{is_user:false,mes:'等待',swipe_id:0,extra:{},swipe_info:[{extra:{}}]}];
const types=Object.fromEntries(['GENERATION_STARTED','MESSAGE_RECEIVED','GENERATION_ENDED','CHAT_CHANGED','MESSAGE_EDITED','MESSAGE_SWIPED','CHARACTER_MESSAGE_RENDERED','MESSAGE_UPDATED','MESSAGE_DELETED','MORE_MESSAGES_LOADED','MESSAGE_SWIPE_DELETED'].map(k=>[k,k]));
const emit=(event,...args)=>(handlers.get(event)||[]).forEach(f=>f(...args));
window.SillyTavern={getContext:()=>({chat,chatId:'preview',streamingProcessor:{messageId:1},extensionSettings:{},eventTypes:types,eventSource:{on:(e,f)=>{if(!handlers.has(e))handlers.set(e,[]);handlers.get(e).push(f)}},saveChat:async()=>{},saveSettingsDebounced:()=>{}})};
await import('/index.js');
async function generate(type){emit('GENERATION_STARTED',type,{},false);const response=await fetch('/api/backends/chat-completions/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({stream:true,model:'mock-gpt',chat_completion_source:'openai'})});await response.text();document.querySelector('[mesid="1"] .mes_block').firstChild.textContent='AI：这是一条模拟回复。';emit('GENERATION_ENDED');emit('MESSAGE_RECEIVED',1,type);}
document.querySelector('#generate').onclick=()=>generate('normal');document.querySelector('#continue').onclick=()=>generate('continue');document.querySelector('#swipe').onclick=()=>{chat[1].swipe_id=1;chat[1].extra={};emit('MESSAGE_SWIPED',1);};
</script></html>
